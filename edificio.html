<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edificio Grupo G · recorrido en vivo</title>
<style>
 :root{--ink:#10243a;--mut:#5a6b7e;--red:#d1403a}
 *{box-sizing:border-box}
 html,body{margin:0;height:100%;overflow:hidden;background:#0b1626;font-family:"Avenir Next",Helvetica,Arial,sans-serif;color:#fff}
 #stage{position:fixed;inset:0;overflow:hidden}
 /* fondo realista con "cámara" que recorre los pisos */
 #bg{position:absolute;inset:-4%;background:#0b1626 center/cover no-repeat;
     transform-origin:50% 50%;transform:scale(1.12);
     transition:transform 2.6s cubic-bezier(.4,0,.2,1),transform-origin 2.6s cubic-bezier(.4,0,.2,1);
     will-change:transform}
 #grad{position:absolute;inset:0;pointer-events:none;
   background:linear-gradient(90deg,rgba(6,14,26,.12) 0%,rgba(6,14,26,.02) 38%,rgba(6,14,26,.55) 72%,rgba(6,14,26,.82) 100%),
              linear-gradient(0deg,rgba(6,14,26,.6) 0%,rgba(6,14,26,0) 26%)}
 /* encabezado */
 #hdr{position:absolute;left:34px;top:26px;z-index:4;text-shadow:0 3px 10px rgba(0,0,0,.55)}
 #hdr h1{margin:0;font-size:34px;font-weight:800;letter-spacing:.3px}
 #hdr p{margin:4px 0 0;font-size:17px;font-weight:600;opacity:.92}
 .chip{display:inline-flex;align-items:center;gap:8px;margin-top:12px;background:rgba(10,18,30,.6);
   border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 15px;font-size:15px;font-weight:700}
 .chip i{width:11px;height:11px;border-radius:50%;background:#21c776;box-shadow:0 0 0 4px rgba(33,199,118,.22);display:inline-block}
 .chip.load i{background:#f0a93a;box-shadow:0 0 0 4px rgba(240,169,58,.22)}
 /* panel de tarjetas por empresa */
 #cards{position:absolute;right:34px;top:50%;transform:translateY(-50%);z-index:4;
   width:38vw;max-width:640px;min-width:360px;display:flex;flex-direction:column;gap:14px}
 .card{position:relative;background:rgba(14,22,36,.72);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
   border:1px solid rgba(255,255,255,.14);border-left:7px solid var(--ac,#888);border-radius:18px;
   padding:15px 20px;box-shadow:0 12px 34px rgba(0,0,0,.4);
   transition:transform .5s cubic-bezier(.3,0,.2,1),box-shadow .5s,background .5s,opacity .5s;opacity:.82}
 .card .top{display:flex;align-items:center;gap:13px}
 .card .plate{background:#fff;border-radius:12px;padding:8px 14px;display:flex;align-items:center;
   box-shadow:0 3px 10px rgba(0,0,0,.28);flex:0 0 auto}
 .card .plate img{display:block;width:auto}
 .card .nm{font-size:25px;font-weight:800;letter-spacing:.3px}
 .card .sub{font-size:14px;font-weight:600;color:#aebccb;margin-left:auto;text-align:right}
 .card .cnt{font-size:15px;font-weight:700;margin-top:9px;color:#cdd9e6}
 .card .cnt b{color:#fff;font-size:17px}
 .card .cnt .ok{color:#49d98b}
 .card ul{list-style:none;margin:9px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
 .card li{font-size:15px;line-height:1.3;background:rgba(255,255,255,.06);border-radius:9px;padding:7px 11px;
   display:flex;gap:9px;align-items:baseline}
 .card li .who{font-weight:800;color:#fff;flex:0 0 auto}
 .card li .tk{color:#d6e0ea;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 /* tarjeta activa (la que está "supervisando") */
 .card.active{opacity:1;transform:scale(1.045);background:rgba(18,28,45,.9);
   border-color:rgba(255,255,255,.4);box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 2px var(--ac)}
 .card .need{margin-top:11px;display:none;font-size:16px;font-weight:700;border-radius:11px;padding:10px 13px;line-height:1.35}
 .card.active .need{display:block}
 .need.go{background:rgba(209,64,58,.18);border:1px solid rgba(209,64,58,.5);color:#ffd7d4}
 .need.ok{background:rgba(33,199,118,.14);border:1px solid rgba(33,199,118,.45);color:#c8f6dd}
 .need .lbl{display:block;font-size:12px;letter-spacing:.8px;text-transform:uppercase;opacity:.85;margin-bottom:3px}
 .need b{color:#fff}
 /* pie: supervisando + barra */
 #foot{position:absolute;left:34px;bottom:30px;z-index:4;display:flex;align-items:center;gap:14px;
   background:rgba(10,18,30,.72);border:1px solid rgba(255,255,255,.14);border-radius:15px;padding:12px 18px;
   box-shadow:0 10px 28px rgba(0,0,0,.4)}
 #foot .eye{font-size:22px}
 #foot .txt{font-size:20px;font-weight:800}
 #foot .txt b{color:#ffd14d}
 #bar{position:absolute;left:0;bottom:0;height:5px;width:0;background:#ffd14d;border-radius:0 3px 3px 0;transition:width .25s linear}
 @media (max-width:820px){ #cards{position:static;transform:none;width:auto;margin:120px 16px 16px;max-width:none}
   #stage{overflow:auto} #hdr h1{font-size:26px} }
</style></head><body>
<div id="stage">
 <div id="bg"></div>
 <div id="grad"></div>
 <div id="hdr">
   <h1>Edificio Grupo G</h1>
   <p>El supervisor recorre cada piso y controla el trabajo en vivo</p>
   <span class="chip load" id="chip"><i></i><span id="chipt">Conectando con el equipo…</span></span>
 </div>
 <div id="cards"></div>
 <div id="foot"><span class="eye">🔍</span><span class="txt">Supervisando: <b id="supn">—</b></span><div id="bar"></div></div>
</div>
<script>
const ESTADO_URL="https://script.google.com/macros/s/AKfycbxVYNdaEsXvCgrwZFtyPhkeWkQUXF0HpOSqlr7x-Ap_BfDtA09lG4uN2FoJ8sHmnjkj/exec";
const BGIMG="edificio_fondo.jpg";
/* empresas, de arriba (último piso) hacia abajo */
const EMP=[
 {k:'gg', nm:'GRUPO G',      sub:'Dirección',                    ac:'#c9a24a', yo:'18%', logo:'logo_gg.png', lh:58},
 {k:'vg', nm:'VG ASOCIADOS', sub:'Contabilidad y administración',ac:'#8b5cf6', yo:'42%', logo:'logo_vg.png', lh:40},
 {k:'ai', nm:'AIMA',         sub:'Comunidad de inversores',      ac:'#d14fb0', yo:'62%', logo:'logo_ai.png', lh:38},
 {k:'dg', nm:'DOBLE G',      sub:'Consultoría y fondos',         ac:'#7c4fd0', yo:'82%', logo:'logo_dg.png', lh:34}
];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function isAima(t){return /aima|asamblea\s*aima|\bsocio/i.test(t);}
let TEAM=null; // {ledy:[],nahobi:[],gabi:[]}
/* reparte las tareas vivas por empresa */
function porEmpresa(){
 const vg=[],ai=[],dg=[]; const T=TEAM||{};
 (T.nahobi||[]).forEach(t=>vg.push(['Nahobi',t]));
 (T.ledy||[]).forEach(t=>vg.push(['Ledy',t]));
 (T.gabi||[]).forEach(t=>(isAima(t)?ai:vg).push(['Gabi',t]));
 const total=vg.length+ai.length+dg.length;
 return {gg:{list:[],total,dir:true}, vg:{list:vg}, ai:{list:ai}, dg:{list:dg}};
}
/* dibuja las tarjetas */
function pintar(){
 const data=porEmpresa(), cont=document.getElementById('cards');
 cont.innerHTML=EMP.map(e=>{
  const d=data[e.k]||{list:[]}, list=d.list||[], n=list.length;
  let cnt, need;
  if(e.k==='gg'){
   const tt=data.gg.total;
   cnt = TEAM ? `El equipo tiene <b>${tt}</b> tarea${tt!==1?'s':''} pendiente${tt!==1?'s':''} en todas las empresas.`
              : `Cargando las tareas del equipo…`;
   need = tt ? `<div class="need go"><span class="lbl">Resumen para usted</span><b>${tt}</b> pendientes en total · el recorrido muestra cuáles y de quién.</div>`
             : `<div class="need ok"><span class="lbl">Resumen para usted</span>Todo al día ✓</div>`;
  } else {
   cnt = !TEAM ? `Cargando tareas…`
        : n ? `<b>${n}</b> tarea${n!==1?'s':''} pendiente${n!==1?'s':''}.`
            : `<span class="ok">Al día ✓ — sin pendientes.</span>`;
   if(n){ const [who,tk]=list[0];
    need=`<div class="need go"><span class="lbl">⚠ Te necesita acá</span><b>${esc(who)}</b> → ${esc(tk)}${n>1?` <span style="opacity:.75">(+${n-1} más)</span>`:''}</div>`;
   } else {
    need=`<div class="need ok"><span class="lbl">Estado</span>Nadie espera su decisión acá por ahora.</div>`;
   }
  }
  const lis = e.k!=='gg' ? `<ul>${list.slice(0,3).map(([who,tk])=>`<li><span class="who">${esc(who)}</span><span class="tk">${esc(tk)}</span></li>`).join('')}</ul>` : '';
  return `<div class="card" data-k="${e.k}" style="--ac:${e.ac}">
    <div class="top"><span class="plate"><img src="${e.logo}" alt="${esc(e.nm)}" style="height:${e.lh}px"></span><span class="sub">${e.sub}</span></div>
    <div class="cnt">${cnt}</div>${lis}${need}</div>`;
 }).join('');
 marcarActiva();
}
/* recorrido: cámara + tarjeta activa */
let idx=0, t0=performance.now(), DWELL=7000;
function marcarActiva(){
 const cards=[...document.querySelectorAll('.card')];
 cards.forEach((c,i)=>c.classList.toggle('active',i===idx));
 const e=EMP[idx];
 document.getElementById('supn').textContent=e.nm;
 const bg=document.getElementById('bg');
 bg.style.transformOrigin='50% '+e.yo; bg.style.transform='scale(1.2)';
}
function tick(now){
 const el=now-t0; document.getElementById('bar').style.width=Math.min(100,el/DWELL*100)+'%';
 if(el>=DWELL){ idx=(idx+1)%EMP.length; t0=now; marcarActiva(); }
 requestAnimationFrame(tick);
}
/* datos vivos */
async function cargar(){
 try{
  const c=new AbortController(); setTimeout(()=>c.abort(),25000);
  const j=await (await fetch(ESTADO_URL+"?t="+Date.now(),{signal:c.signal})).json();
  const pend=o=>((o&&o.tareas)||[]).filter(t=>t&&t.pendiente).map(t=>String(t.tarea||"").trim()).filter(Boolean);
  TEAM={ledy:pend(j.tareasPendLedy),nahobi:pend(j.tareasPendMaga),gabi:pend(j.rodyTareasPend)};
  const chip=document.getElementById('chip'); chip.classList.remove('load');
  document.getElementById('chipt').innerHTML='<b>EN VIVO</b> · tareas del equipo';
  pintar();
 }catch(e){ document.getElementById('chipt').textContent='Sin conexión — reintentando…'; }
}
/* arranque */
const img=new Image();
img.onload=()=>{document.getElementById('bg').style.backgroundImage=`url('${BGIMG}')`;};
img.onerror=()=>{document.getElementById('bg').style.background='linear-gradient(160deg,#14365c,#0b1626)';};
img.src=BGIMG;
pintar(); cargar(); setInterval(cargar,60000);
requestAnimationFrame(tick);
/* recarga suave cada 6 h (limpia el navegador de la TV) */
setTimeout(()=>location.reload(),6*60*60*1000);
</script></body></html>
