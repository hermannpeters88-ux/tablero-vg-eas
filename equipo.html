<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tareas del equipo · VG</title>
<style>
:root{--bg:#f1ece2;--ink:#2a2620;--mut:#7a7366;--card:#fffdf8;--line:#e3dccb;
 --nahobi:#16a34a;--ledy:#d9962a;--gabi:#f97316;--red:#d93a40}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:18px;padding:12px 26px;background:var(--card);border-bottom:2px solid var(--line);flex:none}
header h1{font:800 30px Georgia,"Times New Roman",serif;white-space:nowrap}
header .u{font-size:17px;color:var(--mut);font-weight:600}
.badges{margin-left:auto;display:flex;align-items:center;gap:12px}
.live{display:flex;align-items:center;gap:8px;background:#eafaf0;border:1.5px solid #9ad4b0;color:#15935b;font-weight:800;font-size:15px;padding:5px 14px;border-radius:20px}
.live i{width:11px;height:11px;border-radius:50%;background:#19b866;display:inline-block;box-shadow:0 0 0 0 rgba(25,184,102,.6);animation:p 1.6s infinite}
@keyframes p{70%{box-shadow:0 0 0 7px rgba(25,184,102,0)}100%{box-shadow:0 0 0 0 rgba(25,184,102,0)}}
.upd{font-size:14px;color:var(--mut)}
main{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:16px 20px}
.col{background:var(--card);border:1px solid var(--line);border-top:7px solid var(--c);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:0 2px 10px rgba(80,65,40,.06)}
.ch{padding:13px 18px 11px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--line);flex:none}
.av{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;font:800 20px/46px Georgia,serif;text-align:center;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.ch .nm{font-size:23px;font-weight:800;line-height:1.05}
.ch .ro{font-size:14px;color:var(--mut);font-weight:600}
.ch .ct{margin-left:auto;text-align:center;line-height:1}
.ch .ct b{font:800 34px/1 Georgia,serif;color:var(--c)}
.ch .ct span{font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.list{flex:1;min-height:0;overflow:hidden;padding:8px 10px 10px}
.scr{display:flex;flex-direction:column;gap:7px;will-change:transform}
.t{display:flex;align-items:flex-start;gap:11px;background:#fbf8f1;border:1px solid #ece4d3;border-left:4px solid var(--c);border-radius:9px;padding:9px 13px}
.t .dot{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--c);flex:none;margin-top:4px}
.t.proc{background:#f3f7fb;border-left-color:#5b8def}.t.proc .dot{border-color:#5b8def;background:#5b8def22}
.t .tx{font-size:20px;line-height:1.28;font-weight:600}
.t .tg{font-size:13px;color:var(--mut);font-weight:700;margin-top:2px;display:inline-block}
.empty{color:#15935b;font-weight:700;font-size:20px;padding:16px 6px;text-align:center}
.proch{font-size:13px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin:12px 4px 4px;border-top:1px dashed var(--line);padding-top:10px}
footer{flex:none;padding:7px 26px;background:var(--card);border-top:2px solid var(--line);font-size:14px;color:var(--mut);display:flex;gap:18px;align-items:center}
footer b{color:var(--ink)}
.err{color:var(--red);font-weight:700}
</style></head><body>
<header>
 <h1>Tareas del equipo</h1><span class="u">VG · Contabilidad y Administración</span>
 <div class="badges"><span class="live"><i></i>EN VIVO</span><span class="upd" id="upd">cargando…</span></div>
</header>
<main id="cols">
 <div class="col" style="--c:var(--nahobi)" data-k="nahobi"><div class="ch"><div class="av">N</div><div><div class="nm">Nahobi</div><div class="ro">Contadora Junior</div></div><div class="ct"><b id="c-nahobi">·</b><span>pend.</span></div></div><div class="list"><div class="scr" id="l-nahobi"></div></div></div>
 <div class="col" style="--c:var(--ledy)" data-k="ledy"><div class="ch"><div class="av">L</div><div><div class="nm">Ledy</div><div class="ro">Directora Contable</div></div><div class="ct"><b id="c-ledy">·</b><span>pend.</span></div></div><div class="list"><div class="scr" id="l-ledy"></div></div></div>
 <div class="col" style="--c:var(--gabi)" data-k="gabi"><div class="ch"><div class="av">G</div><div><div class="nm">Gabi</div><div class="ro">Ejecutiva de Cuentas</div></div><div class="ct"><b id="c-gabi">·</b><span>pend.</span></div></div><div class="list"><div class="scr" id="l-gabi"></div></div></div>
</main>
<footer><span>Fuente: <b>tablero VG EAS</b> (tareas reales del equipo)</span><span id="tot"></span><span class="err" id="err"></span></footer>
<script>
const API="https://script.google.com/macros/s/AKfycbxVYNdaEsXvCgrwZFtyPhkeWkQUXF0HpOSqlr7x-Ap_BfDtA09lG4uN2FoJ8sHmnjkj/exec";
const MAP={nahobi:"tareasPendMaga",ledy:"tareasPendLedy",gabi:"rodyTareasPend"};
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fila(t,proc){return '<div class="t'+(proc?' proc':'')+'"><span class="dot"></span><div><span class="tx">'+esc(t.tarea||"")+'</span>'+((t.designa&&String(t.designa).trim())?'<span class="tg">· lo pidió '+esc(t.designa)+'</span>':'')+'</div></div>';}
function pintar(j){
 let tot=0;
 for(const k in MAP){
  const o=j[MAP[k]]||{},tareas=(o.tareas||[]);
  const pend=tareas.filter(t=>t&&t.pendiente);
  const proc=tareas.filter(t=>t&&t.enProceso&&!t.realizada&&!t.pendiente);
  tot+=pend.length;
  document.getElementById("c-"+k).textContent=pend.length;
  let html=pend.length?pend.map(t=>fila(t,false)).join(""):'<div class="empty">✅ Sin pendientes</div>';
  if(proc.length) html+='<div class="proch">En proceso ('+proc.length+')</div>'+proc.map(t=>fila(t,true)).join("");
  document.getElementById("l-"+k).innerHTML=html;
 }
 const d=new Date();
 document.getElementById("upd").textContent="Actualizado "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
 document.getElementById("tot").innerHTML="Total pendientes: <b>"+tot+"</b>";
 document.getElementById("err").textContent="";
}
function cargar(){
 const c=new AbortController();setTimeout(()=>c.abort(),25000);
 fetch(API+"?t="+Date.now(),{cache:"no-store",signal:c.signal}).then(r=>r.json()).then(pintar)
  .catch(e=>{document.getElementById("err").textContent="Sin conexión — reintentando…";});
}
cargar();setInterval(cargar,180000); // refresca cada 3 min
// Auto-scroll lento de las columnas que no entran (la TV no se toca)
setInterval(()=>{document.querySelectorAll(".list").forEach(el=>{
 const sc=el.firstElementChild;if(!sc)return;
 const extra=sc.scrollHeight-el.clientHeight;
 if(extra<=2){sc.style.transform="";el.__d=0;el.__p=0;return;}
 el.__p=el.__p||0;el.__d=el.__d==null?-1:el.__d;el.__y=el.__y||0;
 if(el.__p>0){el.__p--;return;}
 el.__y+=el.__d*0.5;
 if(el.__y<=-extra-6){el.__y=-extra-6;el.__d=0;el.__p=120;setTimeout(()=>{el.__d=1;},10);}
 if(el.__y>=0){el.__y=0;el.__d=0;el.__p=120;setTimeout(()=>{el.__d=-1;},10);}
 if(el.__d===0&&el.__p===0)el.__d=-1;
 sc.style.transform="translateY("+el.__y+"px)";
 });
},40);
// recarga completa cada 2 h (limpia el navegador de la TV)
setTimeout(()=>location.reload(),2*60*60*1000);
</script>
</body></html>
