<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escritorio de Ledy · VG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg0:#0a0e18; --bg1:#111827; --card:#172036; --card2:#1d2942;
    --line:#2b3a5c; --ink:#eef3fb; --muted:#9aabc9; --muted2:#6c7ea0;
    --violet:#8a6fe0; --violet-deep:#623F98; --gold:#CD9834; --cyan:#4fd0e6;
    --ok:#36d07f; --wip:#f3b74a; --off:#44527a; --todo:#ff6079;
    --f:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:var(--f);color:var(--ink);font-size:15px;padding:18px 22px 30px;min-height:100vh;
    background:radial-gradient(1100px 600px at 85% -8%, #1b2748 0%, transparent 58%),
               radial-gradient(800px 600px at -5% 108%, #241a44 0%, transparent 52%),
               linear-gradient(180deg,var(--bg1),var(--bg0));background-attachment:fixed}
  .top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{width:50px;height:50px;border-radius:14px;flex:none;display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff;
    background:linear-gradient(145deg,#7c5cc4,#623F98);box-shadow:0 10px 24px -6px rgba(124,92,196,.6),inset 0 1px 0 rgba(255,255,255,.25)}
  .brand h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px}
  .brand .sub{color:var(--muted);font-size:13px;margin-top:2px;font-weight:500}
  .hud{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .live{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ok);
    background:rgba(54,208,127,.12);border:1px solid rgba(54,208,127,.35);padding:5px 12px;border-radius:999px}
  .live .d{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:bl 1.5s infinite}
  @keyframes bl{50%{opacity:.35}}
  .clock{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums}
  .clock .dd{display:block;font-size:12px;color:var(--muted);text-align:right;font-weight:500;text-transform:capitalize}

  .sect{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);font-weight:700;margin:4px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .sect .mini{color:var(--muted2);font-weight:500;letter-spacing:.3px;text-transform:none;font-size:12.5px}
  .sect .tot{margin-left:auto;font-weight:600;letter-spacing:.2px;text-transform:none;font-size:12.5px;color:var(--muted)}
  .sect .tot b{color:var(--ok)} .sect .tot i{color:var(--wip);font-style:normal}

  .flow{display:flex;align-items:stretch;flex-wrap:wrap;gap:0;row-gap:16px}
  .node{position:relative;flex:1 1 180px;min-width:168px;max-width:240px;border-radius:16px;padding:13px 12px 11px;
    background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);
    box-shadow:0 14px 30px -14px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.05);
    transition:transform .4s, box-shadow .4s, border-color .4s;display:flex;flex-direction:column}
  .nhead{display:flex;align-items:center;gap:11px}
  .orb{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;
    box-shadow:inset 0 2px 5px rgba(255,255,255,.4), inset 0 -6px 10px rgba(0,0,0,.35), 0 8px 16px -6px rgba(0,0,0,.6)}
  .orb svg{width:23px;height:23px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ring{position:absolute;inset:-5px;border-radius:50%;border:2px solid transparent}
  .nhead .step{font-size:14px;font-weight:700;line-height:1.15}
  .nhead .who{font-size:11.5px;color:var(--cyan);font-weight:600;margin-top:1px}
  .nhead .who i{font-style:normal;color:var(--muted2);font-weight:500}
  .cntbox{margin-top:11px;display:flex;align-items:baseline;gap:7px}
  .cntbox b{font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .cntbox span{font-size:12px;color:var(--muted)}
  .chips{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;min-height:10px}
  .chip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#d6e2f6}
  .chip.more{color:var(--muted);background:transparent}
  .none{font-size:11.5px;color:var(--muted2);margin-top:8px;font-style:italic}
  .chip .vb{margin-left:4px;font-size:9.5px;color:var(--wip);font-weight:800}
  .chip .vb.due{color:var(--todo)}
  .vrow{margin-top:10px;display:flex;flex-direction:column;gap:2px}
  .vday{font-size:12px;font-weight:600;color:var(--ink)}
  .vday b{color:var(--wip);font-size:16px;font-variant-numeric:tabular-nums}
  .vday span{color:var(--muted);font-weight:500;font-size:11px}
  .stt{margin-top:auto;padding-top:10px}
  .stt .pill{font-size:9.5px;font-weight:700;letter-spacing:.4px;padding:3px 8px;border-radius:7px;text-transform:uppercase}
  .st-on{color:#06220f;background:var(--ok)} .st-wait{color:#271c05;background:var(--wip)} .st-off{color:#9fb0d6;background:rgba(68,82,122,.3)}
  .node.on{transform:translateY(-4px);border-color:rgba(54,208,127,.5);box-shadow:0 20px 40px -14px rgba(0,0,0,.8),0 0 22px -8px rgba(54,208,127,.5)}
  .node.on .orb{animation:work 1.5s ease-in-out infinite}
  .node.on .ring{border-color:rgba(54,208,127,.6);animation:spin 2.8s linear infinite}
  @keyframes work{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .node.done{border-color:rgba(54,208,127,.35)}
  .node.hot{border-color:rgba(243,183,74,.5)}
  /* conector */
  .arrow{flex:0 0 36px;align-self:center;position:relative;height:3px;margin:0 -2px;border-radius:3px;background:var(--line);min-width:26px}
  .arrow::after{content:"";position:absolute;right:-2px;top:-4px;border-left:9px solid var(--line);border-top:5px solid transparent;border-bottom:5px solid transparent}
  .arrow .dot{position:absolute;top:-3px;left:0;width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);opacity:0}
  .arrow.flow{background:linear-gradient(90deg,var(--ok),rgba(54,208,127,.25))}
  .arrow.flow::after{border-left-color:var(--ok)}
  .arrow.flow .dot{opacity:1;animation:travel 1.3s linear infinite}
  @keyframes travel{from{left:0}to{left:calc(100% - 6px)}}
  @media (max-width:820px){.arrow{flex-basis:100%;height:24px;width:3px;margin:-8px auto;transform:rotate(90deg)}}

  .parallel{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:4px}
  @media (max-width:980px){.parallel{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:560px){.parallel{grid-template-columns:repeat(2,1fr)}}
  .pnode{border-radius:14px;padding:12px 10px;text-align:center;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);box-shadow:0 10px 22px -14px rgba(0,0,0,.7)}
  .pnode .orb{width:40px;height:40px;margin:0 auto 7px} .pnode .orb svg{width:20px;height:20px}
  .pnode .step{font-size:12.5px;font-weight:700} .pnode .who{font-size:10.5px;color:var(--muted);margin-top:1px}
  .pnode .pill{display:inline-block;margin-top:7px;font-size:9px;font-weight:700;letter-spacing:.3px;padding:3px 7px;border-radius:6px;text-transform:uppercase}
  .pnode.on{border-color:rgba(54,208,127,.5)} .pnode.on .orb{animation:work 1.5s ease-in-out infinite} .pnode.on .ring{border-color:rgba(54,208,127,.6);animation:spin 2.8s linear infinite}

  .block{background:rgba(16,22,40,.5);border:1px solid var(--line);border-radius:18px;padding:16px 18px;backdrop-filter:blur(3px)}
  .panel h3{margin:0 0 2px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);font-weight:700}
  .panel .cap{color:var(--muted);font-size:12.5px;margin:0 0 12px}
  .kpis{display:flex;gap:8px;margin-bottom:10px}
  .kpi{flex:1;background:rgba(10,15,30,.55);border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}
  .kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums} .kpi span{font-size:11px;color:var(--muted)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:11px;
    background:rgba(10,15,30,.5);border:1px solid var(--line);margin-bottom:8px}
  .row b{font-size:14.5px} .row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .money{font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold);font-size:15px}
  .empty{color:var(--ok);background:rgba(54,208,127,.1);border:1px solid rgba(54,208,127,.3);border-radius:12px;padding:14px;text-align:center}
  .loading{color:var(--muted);font-size:13px;padding:6px 0}
  .foot{margin-top:16px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><div class="logo">vg</div>
    <div><h1>Escritorio de Ledy</h1><div class="sub">VG Asociados · Directora Contable</div></div>
  </div>
  <div class="hud"><span class="live"><span class="d"></span> EN VIVO</span>
    <div class="clock" id="clock">--:--:--<span class="dd" id="date">—</span></div>
  </div>
</div>

<div class="block" style="margin-bottom:18px">
  <div class="sect">El proceso del cierre <span class="mini">cada cliente, en qué paso está · en vivo</span>
    <span class="tot" id="tot">—</span></div>
  <div class="flow" id="flow"></div>
  <div class="sect" style="margin-top:20px">Los agentes que lo hacen posible <span class="mini">estado real ahora</span></div>
  <div class="parallel" id="parallel"></div>
</div>

<div class="block panel" style="margin-bottom:16px">
  <h3>Para cobrar</h3><p class="cap">Cartera pendiente a tu cargo.</p>
  <div id="cobrar"><div class="loading">Cargando la cartera…</div></div>
</div>

<div class="foot" id="foot">se refresca solo cada 3 minutos</div>

<script>
(function(){
  "use strict";
  var SHEET="1W-B0Sc16DQK2bEVk0TeyVzUatbRaajmw-eMmudiD7Wo";
  var COBROS_API="https://script.google.com/macros/s/AKfycbzPa-w8t8w-atOvJjYR-S7KHksg5acgdnARlMAUF5uRvPJxMAOe4BvJBF2K058a16I/exec";
  var VENC_API="https://script.google.com/macros/s/AKfycbwers-ywe28U2zsp0d3DaJKkU4_pN0zB5dNUp95F5b-_sJWPPbBi_RjHdXlT6m1fYz0/exec";
  var EJECUTIVA="Ledy";
  var G={
    ojo:'<path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/>',
    upload:'<path d="M4 17v3h16v-3"/><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/>',
    doc:'<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M8.5 15l2.5 2.5L16 12"/>',
    persona:'<circle cx="12" cy="8" r="3.4"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/>',
    bandera:'<path d="M6 21V4"/><path d="M6 4h11l-2 4 2 4H6"/>',
    tag:'<path d="M3 11l8-8 9 1 1 9-8 8z"/><circle cx="15" cy="9" r="1.4"/>',
    escudo:'<path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/><path d="M12 8v4l3 2"/>',
    recibo:'<path d="M6 3h12v18l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21z"/><path d="M9 8h6M9 12h6"/>',
    pct:'<path d="M5 19L19 5"/><circle cx="7.5" cy="7.5" r="2.2"/><circle cx="16.5" cy="16.5" r="2.2"/>',
    lupa:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
    maletin:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/>',
    cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>'
  };
  // etapas del cierre -> pasos del flujo (0 Sin iniciar,1 Documentos,2 Carga,3 Revisión,4 OK cliente,5 Presentado)
  var STAGES=[
    {step:"Por iniciar",who:"Lucía",cargo:"Lectura",g:"ojo",c:"#7fb2ff",a:"lector",etapas:[0,1],kind:"agent"},
    {step:"En carga",who:"Carla",cargo:"Carga a Marangatú",g:"upload",c:"#e86aa6",a:"cargador",etapas:[2],kind:"agent"},
    {step:"En revisión",who:"Paula",cargo:"Borrador F120",g:"doc",c:"#c48bff",a:"presentador",etapas:[3],kind:"agent"},
    {step:"Esperando tu OK",who:"Ledy",cargo:"Aprobás",g:"persona",c:"#CD9834",etapas:[4],kind:"human"},
    {step:"Presentados",who:"Concluidos",cargo:"",g:"bandera",c:"#36d07f",etapas:[5],kind:"end"}
  ];
  var PAR=[
    {step:"Imputación",who:"Iván",g:"tag",c:"#3fb6a8",a:"imputador"},
    {step:"Vigía",who:"Vera",g:"escudo",c:"#f0a84b",a:"vigia"},
    {step:"Facturación",who:"Tomás",g:"recibo",c:"#6fd38b",a:"talonario"},
    {step:"Retenciones",who:"Renzo",g:"pct",c:"#ff7a6b",a:"retenciones"},
    {step:"Auditoría",who:"Aldo",g:"lupa",c:"#d9c24b",a:"auditor"},
    {step:"Contador",who:"Bruno",g:"maletin",c:"#5b8def",a:"balanza"}
  ];
  var AG={}, STCL={}, LEDYSET={}, VENC=[], DUE={}; // agentes, clientes x etapa, set clientes Ledy, prox. vencimientos, dia de venc x cliente

  function el(id){return document.getElementById(id);}
  function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
  function num(v){var n=parseInt(String(v==null?"":v).replace(/\D/g,""),10);return isNaN(n)?0:n;}
  function fmtGs(n){try{return "Gs "+Number(n).toLocaleString("es-PY");}catch(e){return "Gs "+n;}}
  function short(nm){return String(nm).replace(/\s*(E\.?A\.?S\.?|S\.?A\.?|S\.?R\.?L\.?)\.?$/i,"").trim();}
  function key(s){return short(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();}
  function hasLedy(){for(var k in LEDYSET)return true;return false;}
  function shade(hex,amt){var m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);if(!m)return hex;function c(x){x=Math.round(parseInt(x,16)*(100+amt)/100);return Math.max(0,Math.min(255,x));}return "#"+[c(m[1]),c(m[2]),c(m[3])].map(function(v){return ("0"+v.toString(16)).slice(-2);}).join("");}

  function orb(n,on){return '<div class="orb" style="background:radial-gradient(circle at 35% 28%, '+n.c+', '+shade(n.c,-38)+')"><span class="ring"></span><svg viewBox="0 0 24 24">'+G[n.g]+'</svg></div>';}
  function pill(st,kind){
    if(kind==="human")return '<span class="pill st-wait">TU PASO</span>';
    if(kind==="end")return '<span class="pill st-on">META</span>';
    return st==="trabajando"?'<span class="pill st-on">TRABAJANDO</span>':(st==="esperando"?'<span class="pill st-wait">ESPERANDO</span>':'<span class="pill st-off">LIBRE</span>');
  }

  function stageHTML(s){
    var cl=[];s.etapas.forEach(function(e){(STCL[e]||[]).forEach(function(x){cl.push(x);});});
    var st=s.a?(AG[s.a]||"libre"):null, on=st==="trabajando";
    var cls="node"+(on?" on":"")+(s.kind==="end"?" done":"")+(cl.length&&s.kind!=="end"?" hot":"");
    var chips;
    if(cl.length===0){chips='<div class="none">'+(s.kind==="end"?"todavía ninguno":"sin clientes acá")+'</div>';}
    else{
      var td=new Date().getDate();
      var shown=cl.slice(0,7).map(function(c){
        var dd=DUE[key(c)], b="";
        if(s.kind!=="end"&&dd)b=' <span class="vb'+((dd-td)<0?" due":"")+'">'+dd+'</span>';
        return '<span class="chip">'+esc(short(c))+b+'</span>';
      }).join("");
      if(cl.length>7)shown+='<span class="chip more">+'+(cl.length-7)+' más</span>';
      chips='<div class="chips">'+shown+'</div>';
    }
    var ccolor=s.kind==="end"?"var(--ok)":(cl.length?"var(--gold)":"var(--muted2)");
    return '<div class="'+cls+'"><div class="nhead">'+orb(s,on)+
      '<div><div class="step">'+esc(s.step)+'</div><div class="who">'+esc(s.who)+(s.cargo?' <i>· '+esc(s.cargo)+'</i>':'')+'</div></div></div>'+
      '<div class="cntbox"><b style="color:'+ccolor+'">'+cl.length+'</b><span>'+(cl.length===1?'cliente':'clientes')+'</span></div>'+
      chips+'<div class="stt">'+pill(st,s.kind)+'</div></div>';
  }
  function vencHTML(){
    var n={step:"Próximos vencimientos",who:"Lo que se viene",g:"cal",c:"#f3b74a"};
    var rows="",any=false,flt=hasLedy();
    VENC.forEach(function(v){
      var cl=v.clientes.filter(function(c){return flt?LEDYSET[key(c)]:true;});
      if(!cl.length)return;any=true;
      var when=v.left<=0?"hoy":("en "+v.left+(v.left===1?" día":" días"));
      var chips=cl.map(function(c){return '<span class="chip">'+esc(short(c))+'</span>';}).join("");
      rows+='<div class="vday"><b>'+v.dia+'</b> <span>· '+when+'</span></div><div class="chips" style="margin-top:3px;margin-bottom:5px">'+chips+'</div>';
    });
    if(!any)rows='<div class="none">sin vencimientos cerca</div>';
    return '<div class="node hot"><div class="nhead">'+orb(n,false)+'<div><div class="step">'+esc(n.step)+'</div><div class="who">'+esc(n.who)+'</div></div></div><div class="vrow">'+rows+'</div><div class="stt"><span class="pill st-wait">AGENDA</span></div></div>';
  }
  function parHTML(n){var st=AG[n.a]||"libre",on=st==="trabajando";
    return '<div class="pnode'+(on?" on":"")+'">'+orb(n,on)+'<div class="step">'+esc(n.step)+'</div><div class="who">'+esc(n.who)+'</div>'+pill(st,"agent")+'</div>';}

  function render(){
    var vact=VENC.some(function(v){return v.clientes.some(function(c){return !hasLedy()||LEDYSET[key(c)];});});
    var parts=[vencHTML(),'<div class="arrow'+(vact?" flow":"")+'"><span class="dot"></span></div>'];
    STAGES.forEach(function(s,i){
      parts.push(stageHTML(s));
      if(i<STAGES.length-1){var src=STAGES[i];var active=src.a&&AG[src.a]==="trabajando";parts.push('<div class="arrow'+(active?" flow":"")+'"><span class="dot"></span></div>');}
    });
    el("flow").innerHTML=parts.join("");
    el("parallel").innerHTML=PAR.map(parHTML).join("");
    // total
    var pres=(STCL[5]||[]).length, falta=0;[0,1,2,3,4].forEach(function(e){falta+=(STCL[e]||[]).length;});
    el("tot").innerHTML='<b>'+pres+'</b> presentados · <i>'+falta+'</i> en proceso';
  }

  function tick(){var d=new Date();function p(n){return (n<10?"0":"")+n;}
    el("clock").firstChild.nodeValue=p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
    el("date").textContent=d.toLocaleDateString("es-PY",{weekday:"long",day:"numeric",month:"long"});}
  setInterval(tick,1000);tick();

  function gviz(sheetName,cb){
    var fn="__cb"+Math.random().toString(36).slice(2,8);
    window[fn]=function(resp){try{var rows=(resp.table.rows||[]).map(function(r){return (r.c||[]).map(function(c){return c?c.v:null;});});cb(null,rows);}catch(e){cb(e);}try{delete window[fn];}catch(_){}if(s.parentNode)s.parentNode.removeChild(s);};
    var s=document.createElement("script");
    s.src="https://docs.google.com/spreadsheets/d/"+SHEET+"/gviz/tq?tqx=out:json;responseHandler:"+fn+"&sheet="+encodeURIComponent(sheetName)+"&_="+Date.now();
    s.onerror=function(){cb(new Error("x"));};document.body.appendChild(s);
  }
  function loadAgentes(){gviz("Agentes",function(err,rows){var m={};if(!err){rows.forEach(function(r){if(r[0])m[String(r[0]).trim()]=String(r[1]||"").trim().toLowerCase();});}AG=m;render();});}
  function loadCierre(){gviz("Cierre",function(err,rows){
      if(err)return;
      var mine=rows.slice(1).filter(function(r){return r[0]&&String(r[9]||"").trim().toLowerCase()===EJECUTIVA.toLowerCase();});
      var g={},set={};mine.forEach(function(r){var e=num(r[4]);(g[e]=g[e]||[]).push(r[0]);set[key(r[0])]=1;});
      STCL=g;LEDYSET=set;render();
    });}
  function loadCobros(){
    fetch(COBROS_API,{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){
      var out=[];(d.clientes||[]).forEach(function(c){(c.facturas||[]).forEach(function(f){
        var resp=String(f.responsable||"").trim().toLowerCase(),est=String(f.estadoCobro||"").trim().toLowerCase();
        if(resp===EJECUTIVA.toLowerCase()&&est.indexOf("pend")===0)out.push({nombre:f.label||f.razonSocial||"(sin nombre)",monto:num(f.monto),mes:f.mes||"",detalle:f.detalle||""});
      });});
      if(!out.length){el("cobrar").innerHTML='<div class="empty">✓ Sin cobros pendientes a tu cargo.</div>';return;}
      out.sort(function(a,b){return b.monto-a.monto;});var total=out.reduce(function(s,x){return s+x.monto;},0);
      el("cobrar").innerHTML='<div class="kpis"><div class="kpi"><b style="color:var(--gold);font-size:17px">'+fmtGs(total)+'</b><span>a cobrar</span></div><div class="kpi"><b>'+out.length+'</b><span>facturas</span></div></div>'+
        out.map(function(x){return '<div class="row"><div><b>'+esc(x.nombre)+'</b><small>'+esc(x.detalle||x.mes)+'</small></div><span class="money">'+fmtGs(x.monto)+'</span></div>';}).join("");
    }).catch(function(){el("cobrar").innerHTML='<div class="loading">Cartera no disponible ahora (se reintenta).</div>';});
  }
  function loadVenc(){
    fetch(VENC_API,{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){
      var today=new Date().getDate(),up=[],due={};
      (d.vencimientos||[]).forEach(function(v){
        (v.clientes||[]).forEach(function(c){due[key(c.nombre)]=v.dia;});
        if(String(v.estado||"")!=="pasado")up.push({dia:v.dia,left:v.dia-today,clientes:(v.clientes||[]).map(function(c){return c.nombre;})});
      });
      VENC=up;DUE=due;render();
    }).catch(function(){});
  }
  render();
  function refreshAll(){loadAgentes();loadCierre();loadCobros();loadVenc();el("foot").textContent="Última actualización: "+new Date().toLocaleTimeString("es-PY")+" · se refresca solo cada 3 minutos";}
  refreshAll();setInterval(refreshAll,180000);
})();
</script>
