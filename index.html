<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV · Grupo G</title>
<style>
 html,body{margin:0;height:100%;background:#f1ece2;overflow:hidden;font-family:"Avenir Next",Helvetica,Arial,sans-serif}
 #f{position:fixed;inset:0;width:100vw;height:100vh;border:0;display:block;background:#f1ece2}
 /* Barra de control: aparece al mover el control remoto y se esconde sola */
 #ctrl{position:fixed;left:50%;bottom:30px;transform:translate(-50%,170%);display:flex;gap:12px;align-items:center;
   background:rgba(22,20,17,.92);padding:13px 18px;border-radius:18px;box-shadow:0 10px 34px rgba(0,0,0,.45);
   transition:transform .35s ease;z-index:99999}
 #ctrl.show{transform:translate(-50%,0)}
 #ctrl button{font:800 23px "Avenir Next",Helvetica,Arial,sans-serif;color:#fff;background:#3b3832;border:3px solid #5c574e;
   border-radius:13px;padding:13px 24px;cursor:pointer;white-space:nowrap}
 #ctrl button:focus{outline:none;border-color:#ffd14d}
 #ctrl button.on{background:#2f6fdc;border-color:#8fb4f5}
 #ctrl #auto{background:#15935b;border-color:#4bbd88}
 #ctrl #auto.paused{background:#c6870d;border-color:#e9b24a}
 #ctrl .sep{width:2px;height:36px;background:#5c574e}
</style></head><body>
<iframe id="f" src="edificio.html" allow="autoplay"></iframe>
<div id="ctrl">
  <button data-s="0">🏢 Oficina</button>
  <button data-s="1">📊 Tablero</button>
  <button data-s="2">✅ Tareas</button>
  <span class="sep"></span>
  <button id="auto">🔄 Auto</button>
</div>
<script>
/* Rotador de la TV. Arranca en los legos y rota solo. Con el control podés tocar un botón
   para ver un reporte puntual (pausa la rotación); vuelve solo a "auto" tras 15 min sin tocar. */
if('serviceWorker' in navigator){try{navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));}catch(e){}}
const SCENES=[
 {url:"edificio.html",min:7},   // Edificio realista + datos vivos — arranca acá
 {url:"tablero.html",min:18},  // Tablero VG EAS (operativo)
 {url:"equipo.html", min:5}    // Tareas del equipo
];
const f=document.getElementById("f"), ctrl=document.getElementById("ctrl"), autoBtn=document.getElementById("auto");
const btns=[...ctrl.querySelectorAll("button[data-s]")];
let i=0, manual=false, hideT, idleT, tourT;
function paint(){ btns.forEach(b=>b.classList.toggle("on", +b.dataset.s===i));
 autoBtn.textContent = manual ? "▶ Volver a auto" : "🔄 Auto"; autoBtn.classList.toggle("paused", manual); }
function show(n){ i=((n%SCENES.length)+SCENES.length)%SCENES.length;
 const s=SCENES[i]; f.src=s.url+(s.url.includes("?")?"&":"?")+"r="+Date.now(); paint(); }
function scheduleAuto(){ clearTimeout(tourT); if(manual) return;
 tourT=setTimeout(()=>{ show(i+1); scheduleAuto(); }, Math.max(1,SCENES[i].min)*60000); }
function reveal(){ ctrl.classList.add("show"); clearTimeout(hideT); hideT=setTimeout(()=>ctrl.classList.remove("show"),5500); }
function entrarManual(n){ manual=true; clearTimeout(tourT); show(n); reveal();
 clearTimeout(idleT); idleT=setTimeout(()=>{ manual=false; scheduleAuto(); paint(); }, 15*60000); }
// escuchar interacción (ventana + dentro del iframe, que es del mismo dominio)
function escuchar(w){ ["mousemove","pointerdown","keydown","touchstart"].forEach(ev=>{ try{ w.addEventListener(ev,reveal,{passive:true}); }catch(e){} }); }
escuchar(window);
f.addEventListener("load",()=>{ try{ escuchar(f.contentWindow); }catch(e){} });
// botones
btns.forEach(b=>b.addEventListener("click",()=>entrarManual(+b.dataset.s)));
autoBtn.addEventListener("click",()=>{ manual=!manual; clearTimeout(idleT);
 if(manual){ clearTimeout(tourT); } else { scheduleAuto(); } paint(); reveal(); });
// atajos: teclas 1/2/3 saltan a un reporte, 0 vuelve a auto (por si el control los manda)
window.addEventListener("keydown",e=>{ if(e.key>="1"&&e.key<="3") entrarManual(+e.key-1);
 else if(e.key==="0"){ manual=false; clearTimeout(idleT); scheduleAuto(); paint(); reveal(); } });
// arranque: muestra los botones 7s para que se vean, después se esconden
show(0); scheduleAuto(); paint();
ctrl.classList.add("show"); hideT=setTimeout(()=>ctrl.classList.remove("show"),7000);
// recarga cada 6 h (limpia el navegador de la TV)
setTimeout(()=>location.reload(),6*60*60*1000);
</script></body></html>
