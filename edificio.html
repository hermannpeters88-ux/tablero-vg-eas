<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edificio Grupo G · recorrido en vivo</title>
<style>
 :root{--ink:#10243a;--mut:#5a6b7e;--red:#d1403a}
 *{box-sizing:border-box}
 html,body{margin:0;height:100%;overflow:hidden;background:#0b1626;font-family:"Avenir Next",Helvetica,Arial,sans-serif;color:#fff}
 #stage{position:fixed;inset:0;overflow:hidden}
 /* --- escena: edificio realista con cámara que recorre los pisos --- */
 #scene{position:absolute;left:0;top:0;bottom:0;right:38%;overflow:hidden;background:#0b1626}
 #bg{position:absolute;inset:-4%;background:#0b1626 center/cover no-repeat;
     transform-origin:50% 50%;transform:scale(1.05);
     transition:transform 2.6s cubic-bezier(.4,0,.2,1),transform-origin 2.6s cubic-bezier(.4,0,.2,1);will-change:transform}
 /* logos como placas fijas en la pared de cada piso */
 .wall{position:absolute;left:4%;z-index:2;display:flex;align-items:center;justify-content:center;
   background:rgba(255,255,255,.93);border-radius:10px;padding:7px 12px;
   box-shadow:0 6px 16px rgba(0,0,0,.4),0 0 0 2px rgba(255,255,255,.25) inset;
   transform:translateY(-50%);transition:opacity .5s,box-shadow .5s;opacity:.95}
 .wall img{display:block;width:auto}
 .wall.on{opacity:1;box-shadow:0 10px 24px rgba(0,0,0,.5),0 0 0 3px var(--ac)}
 #seam{position:absolute;top:0;bottom:0;right:0;width:120px;pointer-events:none;
   background:linear-gradient(90deg,rgba(9,16,28,0),rgba(9,16,28,.9))}
 /* --- panel de reportes (derecha, limpio, fondo sólido) --- */
 #panel{position:absolute;right:0;top:0;bottom:0;width:38%;min-width:380px;z-index:3;
   background:linear-gradient(180deg,#0e1a2b,#0a1320);box-shadow:-24px 0 60px rgba(0,0,0,.5);
   display:flex;flex-direction:column;padding:22px 26px}
 #hdr h1{margin:0;font-size:28px;font-weight:800;letter-spacing:.3px}
 #hdr p{margin:4px 0 0;font-size:15px;font-weight:600;color:#9db0c4}
 .chip{display:inline-flex;align-items:center;gap:8px;margin-top:11px;background:rgba(255,255,255,.06);
   border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700}
 .chip i{width:10px;height:10px;border-radius:50%;background:#21c776;box-shadow:0 0 0 4px rgba(33,199,118,.22);display:inline-block}
 .chip.load i{background:#f0a93a;box-shadow:0 0 0 4px rgba(240,169,58,.22)}
 #cards{flex:1;display:flex;flex-direction:column;gap:11px;justify-content:center;margin:14px 0}
 .card{position:relative;background:#121f33;border:1px solid rgba(255,255,255,.08);
   border-left:7px solid var(--ac,#888);border-radius:15px;padding:13px 18px;
   transition:transform .5s cubic-bezier(.3,0,.2,1),box-shadow .5s,background .5s,opacity .5s;opacity:.72}
 .card .top{display:flex;align-items:center;gap:11px}
 .card .dot{width:15px;height:15px;border-radius:50%;background:var(--ac);flex:0 0 auto;box-shadow:0 0 0 4px rgba(255,255,255,.08)}
 .card .nm{font-size:22px;font-weight:800;letter-spacing:.3px}
 .card .sub{font-size:13px;font-weight:600;color:#8ba0b5;margin-left:auto;text-align:right}
 .card .cnt{font-size:14px;font-weight:700;margin-top:7px;color:#cdd9e6}
 .card .cnt b{color:#fff;font-size:16px}
 .card .cnt .ok{color:#49d98b}
 .card ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
 .card li{font-size:14px;line-height:1.3;background:rgba(255,255,255,.05);border-radius:8px;padding:6px 10px;display:flex;gap:8px;align-items:baseline}
 .card li .who{font-weight:800;color:#fff;flex:0 0 auto}
 .card li .tk{color:#d0dbe6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .card.active{opacity:1;transform:scale(1.03);background:#17273e;box-shadow:0 14px 36px rgba(0,0,0,.5),0 0 0 2px var(--ac)}
 .card .need{margin-top:9px;display:none;font-size:15px;font-weight:700;border-radius:10px;padding:9px 12px;line-height:1.35}
 .card.active .need{display:block}
 .need.go{background:rgba(209,64,58,.16);border:1px solid rgba(209,64,58,.5);color:#ffd7d4}
 .need.ok{background:rgba(33,199,118,.12);border:1px solid rgba(33,199,118,.42);color:#c8f6dd}
 .need .lbl{display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;opacity:.85;margin-bottom:3px}
 .need b{color:#fff}
 #foot{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
   border-radius:13px;padding:11px 15px;position:relative;overflow:hidden}
 #foot .eye{font-size:20px}
 #foot .txt{font-size:18px;font-weight:800}
 #foot .txt b{color:#ffd14d}
 #bar{position:absolute;left:0;bottom:0;height:4px;width:0;background:#ffd14d;transition:width .25s linear}
 @media (max-width:900px){ #scene{right:0;bottom:46%} #panel{width:100%;top:54%;min-width:0} }
</style></head><body>
<div id="stage">
 <div id="scene"><div id="bg"></div><div id="seam"></div></div>
 <div id="panel">
   <div id="hdr">
     <h1>Edificio Grupo G</h1>
     <p>El supervisor recorre cada piso y controla el trabajo en vivo</p>
     <span class="chip load" id="chip"><i></i><span id="chipt">Conectando con el equipo…</span></span>
   </div>
   <div id="cards"></div>
   <div id="foot"><span class="eye">🔍</span><span class="txt">Supervisando: <b id="supn">—</b></span><div id="bar"></div></div>
 </div>
</div>
<script>
const ESTADO_URL="https://script.google.com/macros/s/AKfycbxVYNdaEsXvCgrwZFtyPhkeWkQUXF0HpOSqlr7x-Ap_BfDtA09lG4uN2FoJ8sHmnjkj/exec";
const BGIMG="edificio_fondo.jpg";
/* empresas, de arriba (último piso) hacia abajo. 'wy' = alto del cartel en la pared */
const EMP=[
 {k:'gg', nm:'GRUPO G',      sub:'Dirección',                    ac:'#c9a24a', yo:'16%', logo:'logo_gg.png', wy:46},
 {k:'vg', nm:'VG ASOCIADOS', sub:'Contabilidad y administración',ac:'#8b5cf6', yo:'40%', logo:'logo_vg.png', wy:30},
 {k:'ai', nm:'AIMA',         sub:'Comunidad de inversores',      ac:'#d14fb0', yo:'62%', logo:'logo_ai.png', wy:28},
 {k:'dg', nm:'DOBLE G',      sub:'Consultoría y fondos',         ac:'#7c4fd0', yo:'82%', logo:'logo_dg.png', wy:26}
];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function isAima(t){return /aima|asamblea\s*aima|\bsocio/i.test(t);}
let TEAM=null;
/* --- carteles de pared (dentro de #bg, se mueven con la cámara) --- */
function pintarParedes(){
 const sc=document.getElementById('scene');
 sc.querySelectorAll('.wall').forEach(w=>w.remove());
 EMP.forEach(e=>{
  const d=document.createElement('div'); d.className='wall'; d.dataset.k=e.k;
  d.style.top=e.yo; d.style.setProperty('--ac',e.ac);
  d.innerHTML=`<img src="${e.logo}" alt="${esc(e.nm)}" style="height:${e.wy}px">`;
  sc.appendChild(d);
 });
}
/* --- reparte tareas vivas por empresa --- */
function porEmpresa(){
 const vg=[],ai=[],dg=[]; const T=TEAM||{};
 (T.nahobi||[]).forEach(t=>vg.push(['Nahobi',t]));
 (T.ledy||[]).forEach(t=>vg.push(['Ledy',t]));
 (T.gabi||[]).forEach(t=>(isAima(t)?ai:vg).push(['Gabi',t]));
 const total=vg.length+ai.length+dg.length;
 return {gg:{list:[],total}, vg:{list:vg}, ai:{list:ai}, dg:{list:dg}};
}
/* --- tarjetas de reporte (limpias, con puntito + nombre, sin logo) --- */
function pintar(){
 const data=porEmpresa(), cont=document.getElementById('cards');
 cont.innerHTML=EMP.map(e=>{
  const d=data[e.k]||{list:[]}, list=d.list||[], n=list.length;
  let cnt, need;
  if(e.k==='gg'){
   const tt=data.gg.total;
   cnt = TEAM ? `El equipo tiene <b>${tt}</b> tarea${tt!==1?'s':''} pendiente${tt!==1?'s':''} en todas las empresas.` : `Cargando las tareas del equipo…`;
   need = tt ? `<div class="need go"><span class="lbl">Resumen para usted</span><b>${tt}</b> pendientes en total · el recorrido muestra cuáles y de quién.</div>`
             : `<div class="need ok"><span class="lbl">Resumen para usted</span>Todo al día ✓</div>`;
  } else {
   cnt = !TEAM ? `Cargando tareas…` : n ? `<b>${n}</b> tarea${n!==1?'s':''} pendiente${n!==1?'s':''}.` : `<span class="ok">Al día ✓ — sin pendientes.</span>`;
   if(n){ const [who,tk]=list[0];
    need=`<div class="need go"><span class="lbl">⚠ Te necesita acá</span><b>${esc(who)}</b> → ${esc(tk)}${n>1?` <span style="opacity:.75">(+${n-1} más)</span>`:''}</div>`;
   } else { need=`<div class="need ok"><span class="lbl">Estado</span>Nadie espera su decisión acá por ahora.</div>`; }
  }
  const lis = e.k!=='gg' ? `<ul>${list.slice(0,3).map(([who,tk])=>`<li><span class="who">${esc(who)}</span><span class="tk">${esc(tk)}</span></li>`).join('')}</ul>` : '';
  return `<div class="card" data-k="${e.k}" style="--ac:${e.ac}">
    <div class="top"><span class="dot"></span><span class="nm">${e.nm}</span><span class="sub">${e.sub}</span></div>
    <div class="cnt">${cnt}</div>${lis}${need}</div>`;
 }).join('');
 marcarActiva();
}
/* --- recorrido: cámara + tarjeta activa + cartel de pared activo --- */
let idx=0, t0=performance.now(), DWELL=7000;
function marcarActiva(){
 const e=EMP[idx];
 document.querySelectorAll('.card').forEach(c=>c.classList.toggle('active',c.dataset.k===e.k));
 document.querySelectorAll('#scene .wall').forEach(w=>w.classList.toggle('on',w.dataset.k===e.k));
 document.getElementById('supn').textContent=e.nm;
 const bg=document.getElementById('bg'); bg.style.transformOrigin='50% '+e.yo; bg.style.transform='scale(1.1)';
}
function tick(now){
 const el=now-t0; document.getElementById('bar').style.width=Math.min(100,el/DWELL*100)+'%';
 if(el>=DWELL){ idx=(idx+1)%EMP.length; t0=now; marcarActiva(); }
 requestAnimationFrame(tick);
}
/* --- datos vivos --- */
async function cargar(){
 try{
  const c=new AbortController(); setTimeout(()=>c.abort(),25000);
  const j=await (await fetch(ESTADO_URL+"?t="+Date.now(),{signal:c.signal})).json();
  const pend=o=>((o&&o.tareas)||[]).filter(t=>t&&t.pendiente).map(t=>String(t.tarea||"").trim()).filter(Boolean);
  TEAM={ledy:pend(j.tareasPendLedy),nahobi:pend(j.tareasPendMaga),gabi:pend(j.rodyTareasPend)};
  const chip=document.getElementById('chip'); chip.classList.remove('load');
  document.getElementById('chipt').innerHTML='<b>EN VIVO</b> · tareas del equipo';
  pintar();
 }catch(e){ document.getElementById('chipt').textContent='Sin conexión — reintentando…'; }
}
/* --- arranque --- */
const img=new Image();
img.onload=()=>{document.getElementById('bg').style.backgroundImage=`url('${BGIMG}')`;};
img.onerror=()=>{document.getElementById('bg').style.background='linear-gradient(160deg,#14365c,#0b1626)';};
img.src=BGIMG;
pintarParedes(); pintar(); cargar(); setInterval(cargar,60000);
requestAnimationFrame(tick);
setTimeout(()=>location.reload(),6*60*60*1000);
</script></body></html>
