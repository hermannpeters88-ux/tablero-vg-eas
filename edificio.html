<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edificio Grupo G · recorrido en vivo</title>
<style>
 *{box-sizing:border-box;margin:0;padding:0}
 html,body{height:100%;overflow:hidden;background:#05070d;
   font-family:"Avenir Next",Helvetica,Arial,sans-serif;color:#fff}
 #stage{position:fixed;inset:0;overflow:hidden;background:#05070d}
 /* --- mundo (imagen + logos) que la cámara recorre --- */
 #world{position:absolute;transform-origin:0 0;will-change:transform;
   transition:transform 2.6s cubic-bezier(.45,.05,.2,1)}
 #bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
 .logoW{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;
   filter:drop-shadow(0 3px 7px rgba(0,0,0,.55));opacity:.42;transition:opacity .9s}
 .logoW img{height:100%;width:auto;display:block}
 .logoW.on{opacity:1}
 /* --- marco cinematográfico --- */
 #vig{position:absolute;inset:0;pointer-events:none;z-index:4;
   box-shadow:inset 0 0 220px 40px rgba(0,0,0,.72);
   background:radial-gradient(130% 90% at 50% 46%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
 .bar{position:absolute;left:0;right:0;height:7.5%;background:#05070d;z-index:6;pointer-events:none}
 .bar.top{top:0}.bar.bot{bottom:0}
 /* --- chip EN VIVO --- */
 #live{position:absolute;top:3.2%;left:2.4%;z-index:8;display:flex;align-items:center;gap:10px;
   background:rgba(8,14,24,.72);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);
   border-radius:999px;padding:8px 16px;font-weight:800;font-size:15px;letter-spacing:.4px}
 #live .d{width:11px;height:11px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 0 4px rgba(255,77,77,.25);animation:pulse 1.4s infinite}
 #live.load .d{background:#f0a93a;box-shadow:0 0 0 4px rgba(240,169,58,.25)}
 #live small{font-weight:700;color:#9fb2c6;font-size:13px;letter-spacing:.3px}
 @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
 /* --- MARCADOR de pendientes (arriba-derecha, siempre visible) --- */
 #score{position:absolute;top:3%;right:2.2%;z-index:8;width:300px;
   background:rgba(8,14,24,.82);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);
   border-radius:16px;padding:13px 15px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
 #score .hd{font-size:12px;font-weight:800;letter-spacing:1.2px;color:#9fb2c6;text-transform:uppercase}
 #score .chips{display:flex;gap:8px;margin:9px 0 11px}
 #score .k{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:11px;
   padding:7px 9px;text-align:center}
 #score .k .lab{display:block;font-size:11px;font-weight:700;color:#9fb2c6;letter-spacing:.4px;text-transform:uppercase}
 #score .k .v{font-size:26px;font-weight:900;line-height:1.05;color:#fff}
 #score .k.urg .v{color:#ff6b63}
 #score .rows{display:flex;flex-direction:column;gap:6px}
 #score .r{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
   border-radius:11px;padding:8px 11px;transition:background .5s,box-shadow .5s,border-color .5s}
 #score .r .dot{width:11px;height:11px;border-radius:50%;background:var(--ac);flex:0 0 auto}
 #score .r .nm{font-size:16px;font-weight:800;color:#eaf2fb}
 #score .r .meta{margin-left:auto;display:flex;align-items:baseline;gap:7px}
 #score .r .np{font-size:19px;font-weight:900;color:#fff}
 #score .r .np.z{color:#5ff0a8}
 #score .r .np small{font-size:12px;font-weight:700;color:#9fb2c6;margin-left:2px}
 #score .r .ug{font-size:12px;font-weight:800;color:#ff6b63;background:rgba(209,64,58,.16);
   border:1px solid rgba(209,64,58,.4);border-radius:7px;padding:2px 7px}
 #score .r.on{background:rgba(255,255,255,.12);border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset,0 8px 22px rgba(0,0,0,.4)}
 /* --- título de piso (placa legible, abajo-izquierda) --- */
 #title{position:absolute;left:2.4%;bottom:10%;z-index:8;display:flex;align-items:center;gap:16px;
   background:linear-gradient(135deg,rgba(255,255,255,.97),rgba(243,246,250,.94));
   border-radius:16px;padding:14px 22px 14px 18px;box-shadow:0 16px 40px rgba(0,0,0,.5);
   border-left:8px solid var(--ac,#888);max-width:46%;
   opacity:0;transform:translateY(14px);transition:opacity .7s,transform .7s}
 #title.show{opacity:1;transform:none}
 #title .lg{height:46px;display:flex;align-items:center}
 #title .lg img{height:100%;width:auto;display:block}
 #title .tx .nm{font-size:30px;font-weight:900;letter-spacing:.3px;color:var(--ac,#10243a);line-height:1}
 #title .tx .sb{font-size:16px;font-weight:700;color:#5a6b7e;margin-top:4px}
 /* --- globo de diálogo del compañero (arriba del centro) --- */
 #bubble{position:absolute;left:50%;top:15.5%;z-index:9;transform:translateX(-50%);
   min-width:360px;max-width:60%;opacity:0;transition:opacity .55s}
 #bubble.show{opacity:1}
 #bubble .box{position:relative;background:linear-gradient(180deg,#152536,#0d1826);
   border:1.5px solid var(--ac,#5aa0ff);border-radius:18px;padding:14px 20px 16px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
 #bubble .who{display:flex;align-items:center;gap:9px;margin-bottom:9px}
 #bubble .who i{width:12px;height:12px;border-radius:50%;background:var(--ac,#5aa0ff);box-shadow:0 0 0 4px rgba(255,255,255,.1)}
 #bubble .who .nm{font-size:18px;font-weight:900;color:#fff;letter-spacing:.3px}
 #bubble .who .rol{font-size:12px;font-weight:700;color:#8ba0b5;letter-spacing:.4px}
 #bubble .who .badge{margin-left:auto;display:flex;gap:7px}
 #bubble .who .badge span{font-size:12px;font-weight:800;border-radius:8px;padding:3px 9px;letter-spacing:.3px}
 #bubble .who .badge .p{background:rgba(255,255,255,.1);color:#eaf2fb}
 #bubble .who .badge .u{background:rgba(209,64,58,.18);border:1px solid rgba(209,64,58,.45);color:#ff8f88}
 #bubble .line{font-size:21px;font-weight:800;line-height:1.3;color:#eaf2fb}
 #bubble .line b{color:#ffd14d}
 #bubble .line.ok b,#bubble .line.ok{color:#5ff0a8}
 #bubble .items{list-style:none;display:flex;flex-direction:column;gap:6px}
 #bubble .items li{font-size:18px;font-weight:700;color:#eaf2fb;display:flex;gap:10px;align-items:baseline;
   background:rgba(255,255,255,.05);border-radius:10px;padding:8px 12px}
 #bubble .items li .ar{color:var(--ac);font-weight:900;flex:0 0 auto}
 #bubble .items li .tk{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 #bubble .items li.urg{background:rgba(209,64,58,.15);border:1px solid rgba(209,64,58,.4)}
 #bubble .items li.urg .ar{color:#ff6b63}
 #bubble .more{margin-top:7px;font-size:14px;font-weight:800;color:#9fb2c6}
 #bubble .tail{position:absolute;left:50%;bottom:-13px;width:26px;height:14px;transform:translateX(-50%);overflow:hidden}
 #bubble .tail:after{content:"";position:absolute;left:50%;top:-14px;width:18px;height:18px;
   transform:translateX(-50%) rotate(45deg);background:#0d1826;border-right:1.5px solid var(--ac,#5aa0ff);border-bottom:1.5px solid var(--ac,#5aa0ff)}
 #prog{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--ac,#ffd14d);z-index:10;transition:width .3s linear,background .6s}
 /* --- capa de VIDA: indicadores de actividad sobre los escritorios (se mueven) --- */
 .act{position:absolute;transform:translate(-50%,-50%);z-index:3;display:flex;gap:3px;align-items:center;
   padding:4px 7px;border-radius:999px;background:rgba(10,18,30,.5);opacity:.32;transition:opacity 1s;
   animation:bob 3.4s ease-in-out infinite}
 .act.on{opacity:.9}
 .act b{width:5px;height:5px;border-radius:50%;background:#7fe3ff;display:block;animation:blink 1.25s infinite}
 .act b:nth-child(2){animation-delay:.18s}.act b:nth-child(3){animation-delay:.36s}
 @keyframes blink{0%,78%,100%{opacity:.25;transform:translateY(0)}38%{opacity:1;transform:translateY(-2px)}}
 @keyframes bob{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-66%)}}
 /* --- foco pulsante sobre la persona con la que se habla --- */
 #spot{position:absolute;left:50%;top:50%;width:46vmin;height:46vmin;transform:translate(-50%,-50%);
   z-index:3;pointer-events:none;border-radius:50%;opacity:0;transition:opacity .9s;
   background:radial-gradient(circle,rgba(255,226,150,.17),rgba(255,226,150,0) 66%);
   animation:spulse 2.8s ease-in-out infinite}
 #spot.show{opacity:1}
 @keyframes spulse{0%,100%{transform:translate(-50%,-50%) scale(.9)}50%{transform:translate(-50%,-50%) scale(1.08)}}
</style></head><body>
<div id="stage">
 <div id="world">
   <img id="bg" alt="">
   <div class="logoW" data-k="gg"><img src="l_gg.png" alt="Grupo G"></div>
   <div class="logoW" data-k="vg"><img src="l_vg.png" alt="VG Asociados"></div>
   <div class="logoW" data-k="ai"><img src="l_ai.png" alt="AIMA"></div>
   <div class="logoW" data-k="dg"><img src="l_dg.png" alt="Doble G"></div>
 </div>
 <div id="spot"></div>
 <div class="bar top"></div><div class="bar bot"></div>
 <div id="vig"></div>
 <div id="live" class="load"><span class="d"></span><span id="livet">CONECTANDO</span><small id="lives">buscando al equipo…</small></div>
 <div id="score">
   <div class="hd">Pendientes del equipo</div>
   <div class="chips">
     <div class="k"><span class="lab">Totales</span><span class="v" id="scTot">—</span></div>
     <div class="k urg"><span class="lab">Urgentes</span><span class="v" id="scUrg">—</span></div>
   </div>
   <div class="rows" id="scRows"></div>
 </div>
 <div id="title"><div class="lg"><img id="titlg" alt=""></div><div class="tx"><div class="nm" id="titnm"></div><div class="sb" id="titsb"></div></div></div>
 <div id="bubble"><div class="box">
   <div class="who"><i></i><div><div class="nm" id="bwho"></div><div class="rol" id="brol"></div></div><div class="badge" id="bbadge"></div></div>
   <div class="line" id="bline"></div>
   <ul class="items" id="bitems"></ul>
   <div class="more" id="bmore"></div>
   <div class="tail"></div>
 </div></div>
 <div id="prog"></div>
</div>
<script>
const ESTADO_URL="https://script.google.com/macros/s/AKfycbxVYNdaEsXvCgrwZFtyPhkeWkQUXF0HpOSqlr7x-Ap_BfDtA09lG4uN2FoJ8sHmnjkj/exec";
const BGIMG="edificio_base.jpg?v=16";
const IMGW=1600, IMGH=899;
const FLOORS={
 gg:{ac:'#c9a24a',nm:'GRUPO G',sub:'Dirección',logo:'l_gg.png',       wx:600,wy:72, wh:78},
 vg:{ac:'#8b5cf6',nm:'VG ASOCIADOS',sub:'Contabilidad y administración',logo:'l_vg.png',wx:600,wy:272,wh:40},
 ai:{ac:'#d14fb0',nm:'AIMA',sub:'Comunidad de inversores',logo:'l_ai.png',wx:600,wy:476,wh:42},
 dg:{ac:'#7c4fd0',nm:'DOBLE G',sub:'Consultoría y fondos',logo:'l_dg.png', wx:430,wy:668,wh:40}
};
/* el GUION: cámara que entra piso por piso y habla con cada uno (más lento, más paradas) */
const TOUR=[
 {k:null,fx:800,fy:440,z:1.00,dur:4200,est:true},
 {k:'gg',fx:560,fy:180,z:1.85,dur:5600,sp:'ggDir'},
 {k:'vg',fx:360,fy:392,z:2.05,dur:7000,sp:'Ledy'},
 {k:'vg',fx:650,fy:392,z:2.05,dur:7000,sp:'Nahobi'},
 {k:'vg',fx:890,fy:392,z:2.05,dur:7000,sp:'Gabi'},
 {k:'ai',fx:430,fy:566,z:2.00,dur:6000,sp:'GabiAima'},
 {k:'ai',fx:730,fy:566,z:2.00,dur:5200,sp:'AimaMas'},
 {k:'dg',fx:360,fy:735,z:2.05,dur:5000,sp:'DobleG'}
];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function isAima(t){return /aima|asamblea\s*aima|\bsocio/i.test(t);}
function isUrg(t){return /(vence|vencim|urgent|hoy|ma[ñn]ana|presentar|ddjj|declaraci|pagar|pago|multa|plazo|antes de|cierre)/i.test(t);}
let TEAM=null;
/* tareas vivas por persona */
function pers(){
 const T=TEAM||{}; const gabi=(T.gabi||[]);
 return {
  Ledy:  {who:'Ledy',  rol:'Directora Contable',  tasks:(T.ledy||[])},
  Nahobi:{who:'Nahobi',rol:'Contadora Junior',    tasks:(T.nahobi||[])},
  Gabi:  {who:'Gabi',  rol:'Ejecutiva de Cuentas',tasks:gabi.filter(t=>!isAima(t))},
  GabiAima:{who:'Gabi',rol:'AIMA',                tasks:gabi.filter(t=>isAima(t))}
 };
}
function stat(tasks){return {n:tasks.length,u:tasks.filter(isUrg).length,list:tasks};}
/* --- capa de vida: puntos de actividad sobre los escritorios de cada piso --- */
const ACTS=[
 ['gg',300,120],['gg',600,120],['gg',860,120],
 ['vg',345,332],['vg',635,332],['vg',885,332],
 ['ai',345,512],['ai',635,512],['ai',845,512],
 ['dg',300,690],['dg',520,690]
];
function buildActs(){
 ACTS.forEach(([k,ix,iy])=>{
  const d=document.createElement('div'); d.className='act'; d.dataset.k=k;
  d.style.left=(ix/IMGW*100)+'%'; d.style.top=(iy/IMGH*100)+'%';
  d.innerHTML='<b></b><b></b><b></b>';
  world.appendChild(d);
 });
}
/* --- MARCADOR (totales + por persona) --- */
const ROWS=[['Ledy','Ledy','#8b5cf6'],['Nahobi','Nahobi','#8b5cf6'],['Gabi','Gabi','#d14fb0']];
function pintarScore(){
 const P=pers();
 const S={Ledy:stat(P.Ledy.tasks),Nahobi:stat(P.Nahobi.tasks),
          Gabi:stat(P.Gabi.tasks.concat(P.GabiAima.tasks))};
 const tot=S.Ledy.n+S.Nahobi.n+S.Gabi.n, totU=S.Ledy.u+S.Nahobi.u+S.Gabi.u;
 document.getElementById('scTot').textContent= TEAM? tot : '—';
 document.getElementById('scUrg').textContent= TEAM? totU : '—';
 document.getElementById('scRows').innerHTML=ROWS.map(([key,nm,ac])=>{
   const s=S[key]; const np= !TEAM?'—':s.n;
   const z=(TEAM&&s.n===0)?'z':'';
   const ug=(TEAM&&s.u>0)?`<span class="ug">${s.u} urg.</span>`:'';
   return `<div class="r" data-who="${key}" style="--ac:${ac}"><span class="dot"></span><span class="nm">${nm}</span>
     <span class="meta">${ug}<span class="np ${z}">${np}${TEAM?'<small>pend.</small>':''}</span></span></div>`;
 }).join('');
 marcarFila();
}
function whoOf(sp){ return sp==='Ledy'?'Ledy':sp==='Nahobi'?'Nahobi':(sp==='Gabi'||sp==='GabiAima')?'Gabi':null; }
function marcarFila(){
 const w=whoOf(TOUR[idx].sp);
 document.querySelectorAll('#score .r').forEach(r=>r.classList.toggle('on',r.dataset.who===w));
}
/* --- contenido del globo --- */
function speaker(sp){
 const P=pers();
 if(sp==='ggDir'){
   if(!TEAM) return {who:'Dirección',rol:'Grupo G',line:'Conectando con el equipo…'};
   const S={Ledy:stat(P.Ledy.tasks),Nahobi:stat(P.Nahobi.tasks),Gabi:stat(P.Gabi.tasks.concat(P.GabiAima.tasks))};
   const n=S.Ledy.n+S.Nahobi.n+S.Gabi.n;
   if(!n) return {who:'Dirección',rol:'Grupo G',line:'Todo al día en las tres empresas.',ok:true};
   return {who:'Dirección',rol:'Grupo G',badge:{p:n},
     line:`El equipo tiene <b>${n}</b> pendiente${n!=1?'s':''}:`,
     items:[{t:`Ledy — ${S.Ledy.n}`,urg:S.Ledy.u>0},{t:`Nahobi — ${S.Nahobi.n}`,urg:S.Nahobi.u>0},{t:`Gabi — ${S.Gabi.n}`,urg:S.Gabi.u>0}]};
 }
 if(sp==='AimaMas'){
   if(!TEAM) return {who:'AIMA',rol:'Comunidad',line:'Conectando…'};
   const t=P.GabiAima.tasks;
   if(t.length<=1) return {who:'AIMA',rol:'Comunidad de inversores',line:'Comunidad al día ✓',ok:true};
   return {who:'Gabi',rol:'AIMA',badge:{p:t.length},line:'En AIMA:',
     items:t.slice(0,3).map(x=>({t:x,urg:isUrg(x)})),more:t.length>3?`+${t.length-3} más`:''};
 }
 if(sp==='DobleG') return {who:'Doble G',rol:'Consultoría y fondos',line:'Acompañando a los clientes y al Fondo Doble G.',ok:true};
 const p=P[sp]||{who:sp,rol:'',tasks:[]};
 if(!TEAM) return {who:p.who,rol:p.rol,line:'Cargando…'};
 const t=p.tasks, u=t.filter(isUrg).length;
 if(!t.length) return {who:p.who,rol:p.rol,line:'Todo al día ✓',ok:true};
 return {who:p.who,rol:p.rol,badge:{p:t.length,u},
   line:`Pendientes de ${p.who}:`,
   items:t.slice(0,4).map(x=>({t:x,urg:isUrg(x)})), more:t.length>4?`+${t.length-4} más`:''};
}
/* --- layout del mundo (contain) + logos de pared --- */
const stage=document.getElementById('stage'), world=document.getElementById('world');
let VW,VH,base,w0,h0,left0,top0;
function layout(){
 VW=stage.clientWidth; VH=stage.clientHeight;
 base=Math.min(VW/IMGW, VH/IMGH);
 w0=IMGW*base; h0=IMGH*base; left0=(VW-w0)/2; top0=(VH-h0)/2;
 world.style.width=w0+'px'; world.style.height=h0+'px'; world.style.left=left0+'px'; world.style.top=top0+'px';
 document.querySelectorAll('.logoW').forEach(el=>{
   const f=FLOORS[el.dataset.k];
   el.style.left=(f.wx/IMGW*100)+'%'; el.style.top=(f.wy/IMGH*100)+'%'; el.style.height=(f.wh/IMGH*100)+'%';
 });
 applyShot(false);
}
let idx=0;
function applyShot(animate){
 const s=TOUR[idx];
 if(!animate) world.style.transition='none'; else world.style.transition='';
 const Tx=VW/2-left0-s.fx*base*s.z, Ty=VH/2-top0-s.fy*base*s.z;
 world.style.transform=`translate(${Tx.toFixed(1)}px,${Ty.toFixed(1)}px) scale(${s.z})`;
 if(!animate){ void world.offsetWidth; world.style.transition=''; }
}
function paintShot(){
 const s=TOUR[idx];
 document.querySelectorAll('.logoW').forEach(el=>el.classList.toggle('on',el.dataset.k===s.k));
 const tt=document.getElementById('title');
 if(s.k){ const f=FLOORS[s.k]; tt.style.setProperty('--ac',f.ac);
   document.getElementById('titlg').src=f.logo;
   document.getElementById('titnm').textContent=f.nm;
   document.getElementById('titsb').textContent=f.sub;
   tt.classList.add('show');
 } else tt.classList.remove('show');
 const bub=document.getElementById('bubble');
 if(s.sp){
   const d=speaker(s.sp), ac=(FLOORS[s.k]||{}).ac||'#5aa0ff';
   bub.style.setProperty('--ac',ac);
   document.getElementById('bwho').textContent=d.who;
   document.getElementById('brol').textContent=d.rol||'';
   let bd=''; if(d.badge){ if(d.badge.p!=null) bd+=`<span class="p">${d.badge.p} pend.</span>`; if(d.badge.u) bd+=`<span class="u">${d.badge.u} urg.</span>`; }
   document.getElementById('bbadge').innerHTML=bd;
   const ln=document.getElementById('bline'); ln.innerHTML=d.line||''; ln.className='line'+(d.ok?' ok':'');
   document.getElementById('bitems').innerHTML=(d.items||[]).map(it=>`<li class="${it.urg?'urg':''}"><span class="ar">→</span><span class="tk">${esc(it.t)}</span></li>`).join('');
   document.getElementById('bmore').textContent=d.more||'';
   bub.classList.add('show');
 } else bub.classList.remove('show');
 // capa de vida: actividad del piso activo + foco sobre la persona
 document.querySelectorAll('.act').forEach(a=>a.classList.toggle('on',a.dataset.k===s.k));
 document.getElementById('spot').classList.toggle('show', !!s.sp);
 marcarFila();
}
/* --- motor del recorrido --- */
let t0=performance.now();
function loop(now){
 const s=TOUR[idx], el=now-t0;
 document.getElementById('prog').style.width=Math.min(100,el/s.dur*100)+'%';
 if(el>=s.dur){
   document.getElementById('bubble').classList.remove('show');
   document.getElementById('title').classList.remove('show');
   idx=(idx+1)%TOUR.length; t0=now;
   const f=FLOORS[TOUR[idx].k]; document.getElementById('prog').style.background=(f&&f.ac)||'#ffd14d';
   applyShot(true);
   setTimeout(paintShot, 750);
 }
 requestAnimationFrame(loop);
}
/* --- datos vivos --- */
async function cargar(){
 try{
  const c=new AbortController(); setTimeout(()=>c.abort(),25000);
  const j=await (await fetch(ESTADO_URL+"?t="+Date.now(),{signal:c.signal})).json();
  const pend=o=>((o&&o.tareas)||[]).filter(t=>t&&t.pendiente).map(t=>String(t.tarea||"").trim()).filter(Boolean);
  TEAM={ledy:pend(j.tareasPendLedy),nahobi:pend(j.tareasPendMaga),gabi:pend(j.rodyTareasPend)};
  const lv=document.getElementById('live'); lv.classList.remove('load');
  document.getElementById('livet').textContent='EN VIVO';
  document.getElementById('lives').textContent='tareas del equipo';
  pintarScore(); paintShot();
 }catch(e){ document.getElementById('lives').textContent='sin conexión — reintentando…'; }
}

function start(){ buildActs(); layout(); pintarScore(); paintShot(); requestAnimationFrame(loop); cargar(); setInterval(cargar,60000); }
const im=new Image();
im.onload=()=>{ document.getElementById('bg').src=BGIMG; start(); };
im.onerror=()=>{ document.getElementById('stage').style.background='linear-gradient(160deg,#14365c,#0b1626)'; start(); };
im.src=BGIMG;
window.addEventListener('resize',layout);
setTimeout(()=>location.reload(),6*60*60*1000);
