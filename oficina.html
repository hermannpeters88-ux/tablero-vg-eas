.chip{font-size:20px;border:1px solid var(--line);border-radius:999px;padding:2px 12px;background:#faf6ec;color:#4a443a;display:inline-block;margin:0 6px 5px 0}

main{flex:1;display:flex;min-height:0}

#dots i{width:20px;height:20px;border-radius:50%;background:#ddd5c4;border:2px solid #c9bfa8}

.hace{font-size:25px;line-height:1.3;margin-bottom:4px}
.ps{list-style:none;font-size:24px;line-height:1.28}
.ps li{padding:6px 0 6px 38px;position:relative;border-top:1px solid var(--line)}
.ps li:before{content:attr(data-n);position:absolute;left:0;top:7px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font:700 20px/28px sans-serif;text-align:center}
